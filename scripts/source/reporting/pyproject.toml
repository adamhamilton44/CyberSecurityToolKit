[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cstk-reporting"
version = "0.1.0"
description = "Encrypted engagement notes and deterministic security reports"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<51", "python-docx>=1.2,<2", "rich>=13,<16"]

[project.scripts]
cstk-reporting = "cstk_reporting.cli:main"

[tool.setuptools.packages.find]
include = ["cstk_reporting*"]
